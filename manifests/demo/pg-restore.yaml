apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-demo-restored
spec:
  instances: 3
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: pg-demo